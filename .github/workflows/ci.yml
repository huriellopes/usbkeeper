name: CI
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # A interface (usbkeeper-gui) precisa de WebKit e do frontend compilado: job "gui".
      - run: cargo clippy --workspace --exclude usbkeeper-gui --all-targets -- -D warnings
      - run: cargo test --workspace --exclude usbkeeper-gui

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
        working-directory: apps/gui
      - run: npm test
        working-directory: apps/gui
      - run: npm run build
        working-directory: apps/gui
      - run: cargo clippy -p usbkeeper-gui --all-targets -- -D warnings
      - run: cargo test -p usbkeeper-gui -p usbkeeper-core -p usbkeeper-smart -p usbkeeper-history --features usbkeeper-core/ts,usbkeeper-smart/ts,usbkeeper-history/ts
      - name: tipos TS gerados estão atualizados
        run: git diff --exit-code apps/gui/src/lib/bindings
