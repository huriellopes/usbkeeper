[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/platform-linux",
    "crates/platform-windows",
    "crates/smart",
    "crates/history",
    "crates/guide",
    "apps/cli",
    "apps/gui/src-tauri",
]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/huriellopes/usbkeeper"

[workspace.dependencies]
usbkeeper-core = { path = "crates/core" }
usbkeeper-windows = { path = "crates/platform-windows" }
usbkeeper-linux = { path = "crates/platform-linux" }
usbkeeper-smart = { path = "crates/smart" }
usbkeeper-history = { path = "crates/history" }
usbkeeper-guide = { path = "crates/guide" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tempfile = "3"
libc = "0.2"
ts-rs = { version = "10", features = ["serde-json-impl"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
sha2 = "0.10"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Security", "Win32_System_Threading", "Win32_Devices_DeviceAndDriverInstallation", "Win32_System_Pipes", "Win32_System_Console", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry"] }
zstd = "0.13"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ctrlc = "3"
rusqlite = { version = "0.43", features = ["bundled"] }

# Binários menores e mais leves na memória (sem mudar o comportamento).
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
