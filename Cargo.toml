[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/platform-linux",
    "crates/smart",
    "crates/history",
    "crates/guide",
    "apps/cli",
    "apps/gui/src-tauri",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/huriellopes/usbkeeper"

[workspace.dependencies]
usbkeeper-core = { path = "crates/core" }
usbkeeper-linux = { path = "crates/platform-linux" }
usbkeeper-smart = { path = "crates/smart" }
usbkeeper-history = { path = "crates/history" }
usbkeeper-guide = { path = "crates/guide" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tempfile = "3"
libc = "0.2"
ts-rs = { version = "10", features = ["serde-json-impl"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ctrlc = "3"
rusqlite = { version = "0.43", features = ["bundled"] }
