[workspace]
resolver = "3"
members = ["crates/core", "crates/platform-linux", "crates/smart", "crates/history", "apps/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/huriellopes/usbkeeper"

[workspace.dependencies]
usbkeeper-core = { path = "crates/core" }
usbkeeper-linux = { path = "crates/platform-linux" }
usbkeeper-smart = { path = "crates/smart" }
usbkeeper-history = { path = "crates/history" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tempfile = "3"
libc = "0.2"
ts-rs = { version = "10", features = ["serde-json-impl"] }
ctrlc = "3"
rusqlite = { version = "0.43", features = ["bundled"] }
